---
permalink: /art/
photos: []
---
<!DOCTYPE HTML>
<html lang="en">

<head>
  <title>Photography | {{ site.name }}</title>
  <meta content="text/html; charset=utf-8" http-equiv="Content-Type">
  <meta name="author" content="{{ site.name }}" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="{{ site.baseurl }}/favicon.ico">
  <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/style.css" />
  <link href="https://fonts.googleapis.com/css?family=Lato:400,700,400italic,700italic" rel="stylesheet" type="text/css">
</head>

<body>
  <table style="width:100%;max-width:1000px;border:0px;border-spacing:0px;border-collapse:separate;margin-right:auto;margin-left:auto;">
    <tr>
      <td style="padding:2.5%;width:100%;vertical-align:middle">

        <a href="{{ site.baseurl }}/" style="color: #666; font-size: 14px; font-weight: 500;">&larr; Back to home</a>

        <h1 style="text-align: left; font-weight: 700; margin-top: 16px; margin-bottom: 8px; font-size: 32px; color: #111;">
          Photography
        </h1>
        <div style="width: 60px; height: 4px; background: linear-gradient(135deg, #6366f1, #db2777); margin-bottom: 20px; border-radius: 2px;"></div>
        <p style="font-size: 15px; line-height: 1.6; color: #444; margin-bottom: 32px;">
          A collection of photos I've taken for fun.
        </p>

        {% if page.photos.size > 0 %}
        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px;">
          {% for photo in page.photos %}
          <div style="overflow: hidden; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.06);">
            <img src="{{ site.baseurl }}/images/portfolio/{{ photo }}" style="width:100%; height:100%; display:block; object-fit: cover; aspect-ratio: 1/1;" alt="{{ photo }}" loading="lazy">
          </div>
          {% endfor %}
        </div>
        {% else %}
        <div style="padding: 48px 24px; text-align: center; color: #999; font-size: 14px; border: 1px dashed #eaeaea; border-radius: 12px;">
          Photos coming soon.
        </div>
        {% endif %}

        <div style="text-align: center; margin-top: 60px; padding-top: 24px; border-top: 1px solid #eaeaea; color: #999; font-size: 14px;">
          <a href="{{ site.baseurl }}/" style="color: #999; font-weight: 500;">&larr; Back to home</a>
        </div>

      </td>
    </tr>
  </table>
</body>

</html>
